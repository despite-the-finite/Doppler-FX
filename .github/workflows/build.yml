name: Build

# Produces installable plugin binaries for each platform. Download them from
# the "Artifacts" section of a finished run, or from a tagged release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP checks
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          # Plugin bundles are directories on every platform, so copy recursively.
          find build/DopplerFX_artefacts -maxdepth 3 \
               \( -name "*.vst3" -o -name "*.component" \) -print0 \
            | xargs -0 -I{} cp -R {} dist/
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: DopplerFX-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
