name: Build

# Produces installable plugin binaries for each platform. Download them from
# the "Artifacts" section of a finished run, or, for a tagged build, from the
# release the last job attaches them to.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Cut a release at this tag, e.g. v1.0.0. Leave blank to just build."
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP checks
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          # Plugin bundles are directories on every platform, so copy recursively.
          find build/DopplerFX_artefacts -maxdepth 3 \
               \( -name "*.vst3" -o -name "*.component" \) -print0 \
            | xargs -0 -I{} cp -R {} dist/
          ls -R dist

      # Zip on the build runner rather than letting upload-artifact do it.
      # A plugin bundle is a directory, and the artifact upload drops the
      # executable bit and flattens symlinks on the way through -- which is
      # exactly what a macOS .vst3 or .component needs kept. Zipping here
      # means the file attached to the release is the one that was built.
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../DopplerFX-${{ matrix.name }}.zip" ./*
          else
            zip -r -y "../DopplerFX-${{ matrix.name }}.zip" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DopplerFX-${{ matrix.name }}
          path: DopplerFX-${{ matrix.name }}.zip
          if-no-files-found: error

  # Only on a v* tag, and only once all three builds are green: collect the
  # three zips and hang them off a release, so there is a permanent download
  # that does not expire and does not ask for a GitHub sign-in.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Collect the zips
        run: |
          mkdir -p dist
          find artefacts -name '*.zip' -exec mv {} dist/ \;
          ls -l dist

      # Either the tag that was pushed, or the one the manual run asked for --
      # gh creates a tag at this commit when it does not exist yet, so a
      # release can be cut without pushing a tag by hand.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a release replaces the assets rather than failing.
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Doppler FX $TAG" \
              --generate-notes
          fi
